<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142418"/>
      <stop offset="1" stop-color="#0b080c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#glow)"/>
  <rect width="800" height="3" fill="#4ade80" opacity="0.6"/>

  <g transform="translate(160,56)">
    <!-- shopping cart body -->
    <path d="M10 60 H150 L136 120 H46 L20 24 H4 L0 14" fill="none" stroke="#4ade80" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- handle -->
    <path d="M10 60 L26 84" fill="none" stroke="#4ade80" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round"/>
    <!-- wheels -->
    <circle cx="54" cy="150" r="16" fill="none" stroke="#4ade80" stroke-opacity="0.8" stroke-width="3"/>
    <circle cx="112" cy="150" r="16" fill="none" stroke="#4ade80" stroke-opacity="0.8" stroke-width="3"/>
    <circle cx="54" cy="150" r="5" fill="#4ade80"/>
    <circle cx="112" cy="150" r="5" fill="#4ade80"/>
    <!-- items in cart -->
    <circle cx="58" cy="108" r="12" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="72" y="96" width="20" height="20" rx="4" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M94 118 l10 -10 l10 10 l-10 10 z" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80" stroke-opacity="0.7" stroke-width="2"/>
  </g>

  <text x="48" y="298" fill="#4ade80" font-family="system-ui, sans-serif" font-size="20" font-weight="600" letter-spacing="4">E-COMMERCE BACKEND</text>
  <text x="46" y="352" fill="#f4f0f7" font-family="system-ui, sans-serif" font-size="54" font-weight="700">Ecoshop</text>
</svg>
